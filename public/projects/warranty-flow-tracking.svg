<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Warranty Flow job tracking</title>
  <desc id="desc">Flutter job tracking and receipt screen preview with timeline, status lifecycle, and payment details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0f172a"/>
      <stop offset=".5" stop-color="#581c87"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="status" x1="0" x2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#020617" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="86" y="72" width="1028" height="616" rx="34" fill="#020617" fill-opacity=".64" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="136" y="150" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="900">Job Tracking</text>
  <text x="138" y="188" fill="#bae6fd" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Warranty status lifecycle and receipt records</text>
  <rect x="136" y="238" width="420" height="356" rx="28" fill="url(#card)" filter="url(#shadow)"/>
  <text x="178" y="302" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="900">Repair #WF-2048</text>
  <text x="180" y="334" fill="#475569" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">Phone display replacement</text>
  <rect x="180" y="384" width="290" height="16" rx="8" fill="#e2e8f0"/>
  <rect x="180" y="384" width="214" height="16" rx="8" fill="url(#status)"/>
  <g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="900">
    <circle cx="186" cy="456" r="15" fill="#38bdf8"/>
    <text x="222" y="462" fill="#0f172a">Received</text>
    <circle cx="186" cy="504" r="15" fill="#a855f7"/>
    <text x="222" y="510" fill="#0f172a">Under inspection</text>
    <circle cx="186" cy="552" r="15" fill="#f43f5e"/>
    <text x="222" y="558" fill="#0f172a">Ready for pickup</text>
  </g>
  <path d="M186 472v17M186 520v17" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <rect x="626" y="138" width="386" height="516" rx="32" fill="url(#card)" filter="url(#shadow)"/>
  <text x="676" y="214" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="900">Receipt View</text>
  <text x="678" y="248" fill="#64748b" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800">Customer, shop, payment, and claim data</text>
  <rect x="678" y="300" width="282" height="66" rx="18" fill="#dbeafe"/>
  <text x="710" y="340" fill="#075985" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="900">Customer: Arsalan</text>
  <rect x="678" y="392" width="282" height="66" rx="18" fill="#f3e8ff"/>
  <text x="710" y="432" fill="#581c87" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="900">Status: Partial paid</text>
  <rect x="678" y="484" width="282" height="66" rx="18" fill="#ffe4e6"/>
  <text x="710" y="524" fill="#9f1239" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="900">Warranty: Active</text>
  <rect x="678" y="584" width="130" height="34" rx="17" fill="#0f172a"/>
  <text x="716" y="606" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900">View PDF</text>
  <rect x="828" y="584" width="132" height="34" rx="17" fill="#38bdf8"/>
  <text x="858" y="606" fill="#082f49" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="900">Share link</text>
  <path d="M546 416c44-38 80-40 112-6" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" stroke-opacity=".86"/>
  <path d="M546 476c42 36 80 34 112 0" fill="none" stroke="#f43f5e" stroke-width="10" stroke-linecap="round" stroke-opacity=".82"/>
  <circle cx="1056" cy="218" r="52" fill="#38bdf8" fill-opacity=".16"/>
  <circle cx="1056" cy="218" r="23" fill="#38bdf8" fill-opacity=".44"/>
  <circle cx="96" cy="642" r="78" fill="#a855f7" fill-opacity=".12"/>
</svg>
