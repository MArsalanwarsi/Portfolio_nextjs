<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Create Modern MERN App</title>
  <desc id="desc">Official npm package documentation and quickstart generator for enterprise MERN stack development</desc>
  <defs>
    <clipPath id="viewportClip">
      <rect x="0" y="52" width="1200" height="708"/>
    </clipPath>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1f"/>
      <stop offset="100%" stop-color="#121214"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="#0d0d0f"/>
  <g clip-path="url(#viewportClip)">
    <image href="data:image/png;base64," x="0" y="52" width="1200" height="708" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <!-- Browser Chrome Top Bar -->
  <rect width="1200" height="52" fill="url(#headerGrad)"/>
  <line x1="0" y1="52" x2="1200" y2="52" stroke="#2d2d32" stroke-width="1"/>
  <!-- Window Controls -->
  <circle cx="28" cy="26" r="6" fill="#ef4444" opacity="0.85"/>
  <circle cx="48" cy="26" r="6" fill="#eab308" opacity="0.85"/>
  <circle cx="68" cy="26" r="6" fill="#22c55e" opacity="0.85"/>
  <!-- URL Address Bar -->
  <rect x="110" y="12" width="460" height="28" rx="6" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
  <circle cx="128" cy="26" r="3.5" fill="#00e676"/>
  <text x="142" y="31" fill="#e4e4e7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="500">create-modern-mern-app.vercel.app</text>
  <!-- Active Badge -->
  <rect x="1080" y="14" width="94" height="24" rx="4" fill="#00e676" fill-opacity="0.15" stroke="#00e676" stroke-opacity="0.4"/>
  <text x="1127" y="30" fill="#00e676" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="600" text-anchor="middle">VERIFIED</text>
</svg>