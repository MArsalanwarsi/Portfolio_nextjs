  <rect x="106" y="424" width="630" height="200" rx="22" fill="#f8fafc" opacity=".95"/>
  <text x="138" y="474" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700">Room status</text>
  <g><rect x="138" y="510" width="152" height="74" rx="16" fill="#ccfbf1"/><rect x="318" y="510" width="152" height="74" rx="16" fill="#dbeafe"/><rect x="498" y="510" width="152" height="74" rx="16" fill="#fed7aa"/></g>
