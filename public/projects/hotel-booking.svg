<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Hotel booking dashboard</title>
  <desc id="desc">A hotel booking interface with reservation metrics, room cards, and guest status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0f766e"/><stop offset=".55" stop-color="#132f3a"/><stop offset="1" stop-color="#10151f"/></linearGradient>
    <linearGradient id="card" x1="0" x2="1"><stop stop-color="#ffffff" stop-opacity=".92"/><stop offset="1" stop-color="#d8fff7" stop-opacity=".82"/></linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="70" y="58" width="1060" height="644" rx="28" fill="#071115" opacity=".72"/>
  <rect x="106" y="96" width="988" height="76" rx="18" fill="#ffffff" opacity=".94"/>
  <circle cx="148" cy="134" r="14" fill="#ef4444"/><circle cx="186" cy="134" r="14" fill="#f59e0b"/><circle cx="224" cy="134" r="14" fill="#22c55e"/>
  <text x="280" y="142" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Booking Desk</text>
  <rect x="106" y="210" width="292" height="174" rx="20" fill="url(#card)"/>
  <text x="138" y="258" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">72%</text>
  <text x="138" y="292" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">Occupancy today</text>
  <path d="M138 338h205" stroke="#0f766e" stroke-width="18" stroke-linecap="round"/><path d="M138 338h144" stroke="#22c55e" stroke-width="18" stroke-linecap="round"/>
  <rect x="430" y="210" width="306" height="174" rx="20" fill="#ecfeff" opacity=".92"/>
  <text x="462" y="258" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">128</text>
  <text x="462" y="292" fill="#334155" font-family="Inter,Arial,sans-serif" font-size="18">Active reservations</text>
  <rect x="462" y="326" width="226" height="16" rx="8" fill="#cbd5e1"/><rect x="462" y="326" width="172" height="16" rx="8" fill="#14b8a6"/>
