<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Task manager kanban board</title>
  <desc id="desc">Kanban task board with columns for backlog, active, review, and done work.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#2563eb"/><stop offset=".52" stop-color="#0f766e"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="80" y="72" width="1040" height="616" rx="34" fill="#f8fafc"/>
  <text x="132" y="144" fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="900">Team Sprint</text>
  <g><rect x="132" y="196" width="218" height="406" rx="24" fill="#dbeafe"/><rect x="388" y="196" width="218" height="406" rx="24" fill="#ccfbf1"/><rect x="644" y="196" width="218" height="406" rx="24" fill="#ffedd5"/><rect x="900" y="196" width="128" height="406" rx="24" fill="#dcfce7"/></g>
  <g fill="#0f172a" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800"><text x="168" y="244">Backlog</text><text x="424" y="244">Active</text><text x="680" y="244">Review</text><text x="936" y="244">Done</text></g>
  <g fill="#ffffff"><rect x="160" y="278" width="162" height="80" rx="18"/><rect x="160" y="382" width="162" height="80" rx="18"/><rect x="416" y="278" width="162" height="106" rx="18"/><rect x="416" y="410" width="162" height="80" rx="18"/><rect x="672" y="278" width="162" height="80" rx="18"/><rect x="928" y="278" width="72" height="80" rx="18"/></g>
  <g fill="#64748b"><rect x="184" y="312" width="96" height="12" rx="6"/><rect x="440" y="312" width="112" height="12" rx="6"/><rect x="696" y="312" width="92" height="12" rx="6"/></g>
</svg>
